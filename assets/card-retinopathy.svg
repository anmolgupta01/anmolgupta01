<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" width="600" height="370" role="img" aria-label="Diabetic Retinopathy Detection"><title>Diabetic Retinopathy Detection</title><style>text{font-family:'Segoe UI Black','Arial Black','Helvetica Neue',Arial,sans-serif}.mono{font-family:'JetBrains Mono','Cascadia Code',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace}.sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.tw{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.float{animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-9px)}}.shadow{transform-box:fill-box;transform-origin:center;animation:shadow 5s ease-in-out infinite}@keyframes shadow{50%{transform:scale(.82);opacity:.3}}</style><defs><filter id="glow" filterUnits="userSpaceOnUse" x="-500" y="-500" width="3000" height="3000"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glowL" filterUnits="userSpaceOnUse" x="-500" y="-500" width="3000" height="3000"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" filterUnits="userSpaceOnUse" x="-500" y="-500" width="3000" height="3000"><feGaussianBlur stdDeviation="14"/></filter></defs><ellipse class="shadow" cx="300" cy="346" rx="230" ry="16" fill="#ff2bd6" opacity=".35" filter="url(#soft)"/><g class="float"><linearGradient id="cf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0f45"/><stop offset="1" stop-color="#0c0628"/></linearGradient><linearGradient id="cb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2bd6"/><stop offset=".45" stop-color="#ff2bd6" stop-opacity="0"/><stop offset=".7" stop-color="#00f0ff" stop-opacity=".9"/><stop offset="1" stop-color="#ff2bd6"/><animateTransfor