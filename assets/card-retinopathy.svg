gnosis.</text><rect x="56" y="262" width="48.9" height="30" rx="8" fill="#ff2bd6" fill-opacity=".1" stroke="#ff2bd6" stroke-opacity=".6"/><text class="mono" x="80.5" y="282" font-size="13" text-anchor="middle" fill="#ff2bd6">CNN</text><rect x="114.9" y="262" width="115.3" height="30" rx="8" fill="#ff2bd6" fill-opacity=".1" stroke="#ff2bd6" stroke-opacity=".6"/><text class="mono" x="172.6" y="282" font-size="13" text-anchor="middle" fill="#ff2bd6">InceptionV3</text><rect x="240.2" y="262" width="148.5" height="30" rx="8" fill="#ff2bd6" fill-opacity=".1" stroke="#ff2bd6" stroke-opacity=".6"/><text class="mono" x="314.5" y="282" font-size="13" text-anchor="middle" fill="#ff2bd6">Medical Imaging</text><text class="mono" x="536" y="282" font-size="14" font-weight="700" text-anchor="end" fill="#ff2bd6">VIEW REPO →</text></g></svg>
